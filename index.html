<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monoposto Companion</title>
<meta name="description" content="A data-driven championship manager companion for the Monoposto F1 career mode.">
<meta property="og:title" content="Monoposto Companion">
<meta property="og:description" content="A data-driven championship manager companion for the Monoposto F1 career mode.">
<link rel="stylesheet" href="css/variables.css?v=20261022m">
<link rel="stylesheet" href="css/global.css?v=20261022m">
<link rel="stylesheet" href="css/components.css?v=20261022m">
</head>
<body>
<header id="siteheader">
  <div class="sitebrand">
    <img src="assets/logos/f1.svg" alt="Formula 1">
    <span class="siteyear">2026</span>
    <span class="sitesub">MONOPOSTO<br>CAREER ENGINE</span>
  </div>
  <nav id="mainnav">
    <a href="#/matrix" data-route="matrix">World Standings<br>&amp; R&amp;D Matrix</a>
    <a href="#/hq" data-route="hq">Team HQ</a>
    <a href="#/race" data-route="race">Race Control</a>
    <a href="#/rd" data-route="rd">R&amp;D</a>
    <a href="#/facilities" data-route="facilities">Facilities</a>
    <a href="#/standings" data-route="standings">Standings</a>
    <a href="#/devgraph" data-route="devgraph">Dev Graph</a>
    <a href="#/sponsors" data-route="sponsors">Sponsors &amp; Staff</a>
    <a href="#/market" data-route="market">Driver Contracts</a>
  </nav>
  <div class="sitesettings" id="sitesettings">
    <button class="settingsbtn" id="settings-btn" aria-label="Settings" title="Settings">⚙</button>
    <div class="settingsmenu" id="settings-menu" hidden>
      <div class="settingsmenu-h">SETTINGS</div>
      <button id="set-export">Export save (JSON)</button>
      <label class="setimport" for="set-import">Import save (JSON)</label>
      <input type="file" id="set-import" accept="application/json,.json" hidden>
      <div class="settingsmenu-div"></div>
      <button id="set-delete" class="danger">Delete championship…</button>
    </div>
  </div>
</header>
<div id="app"></div>
<script type="module" src="main.js?v=20261022m"></script>
</body>
</html>
